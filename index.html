<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="images/favicon.svg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Router Settings</title>
</head>
<style>
    body{
        background: orange;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-weight: 900;
        font-style: italic;
    }
    .logo{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin-top: -300px;
        background: white;
    }
    .parent{
        width: 500px;
        height: 300px;
        background: linear-gradient(to bottom,yellow,red);
        border: none;
        box-shadow: 0px 0px 10px black;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;

    }
    .text,.password{
        height: 30px;
        outline-color: black;
        width: 300px;
        border-radius: 1px;
        /*input style*/
        border-top: none;
        border-left: none;
        border-right: none;
        border-bottom: 2px black solid;
        background: transparent;
        outline: none;
    }
    ::placeholder{
        color:black
    }
    .login,.reset{
        width: 200px;
        height: 50px;
        border-radius: 100px 100px 100px;
        margin-top: 30px;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 900;
        cursor: pointer;
        background: yellow;
        color: black;
    }
    .login:hover{
        background: rgba(255, 255, 0, 0.763);
    }
    .reset:hover{
        background: rgba(255, 255, 0, 0.763);
    }
    h3{
        display: none;
    }
    @media (max-width: 600px) {
        .parent {
            width: 80%;
            height: auto;
            padding: 20px;
            border-radius: 10px;
        }
        .logo {
            display: none;
        }
        .text,.password {
            width: 100%;
            margin-bottom: 10px;
        }
        img {
            margin-bottom: 10px;
        }
        span {
            display: block;
            margin-bottom: 10px;
        }
        .login,.reset{
            border:2px solid black
        }
        h3{
            display: block;
            color: white;
        }
    }
</style>
<body>
    <img src="images/logo-gnet-1.png" alt="logo" class="logo">
    <div class="parent">
        <h1>Router Login</h1>
        <img src="images/user.svg" alt="user"><span>User Name:</span>
        <input type="text" name="#" id="#" class="text" placeholder="Enter Your Router Username">
        <BR></BR>
        <img src="images/password.svg" alt="password"><span>Password:</span>
        <input type="password" name="#" id="#" class="password" placeholder="Enter Your Router Password" >
        <BR></BR>
        <input type="button" value="Login" class="login" onclick="document.location.href='router page.html'">
        <button type="reset" class="reset">Reset</button>
        <h3>*Using a Pc Will Be Better For a Full Costimazation</h3>
    </div>
    <script src="main.js"></script>
</body>
</html>
